<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نیما حسینی — مشاور بازاریابی دیجیتال</title>
<style>
:root { --bg:#fff; --fg:#111; --muted:#666; }
@media (prefers-color-scheme:dark){ :root{--bg:#111;--fg:#eee;--muted:#aaa;} }
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;}
.wrap{max-width:720px;margin:0 auto;padding:3rem 1.5rem;}
header{margin-bottom:3rem;}
h1{font-size:2.4rem;margin:0 0 0.5rem;}
.tag{color:var(--muted);}
section{margin:2.5rem 0;}
.cta{display:inline-block;background:var(--fg);color:var(--bg);padding:0.8rem 1.6rem;text-decoration:none;border-radius:4px;}
ul{padding-right:1.2rem;}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>نیما حسینی</h1>
<p class="tag">مشاور بازاریابی دیجیتال و رشد برند</p>
</header>
<section>
<h2>چه کمکی می‌کنم</h2>
<ul>
<li>طراحی استراتژی بازاریابی محتوایی</li>
<li>بهینه‌سازی فانل فروش</li>
<li>گزارش‌گیری و تحلیل کامپین</li>
</ul>
</section>
<section>
<h2>تجربه</h2>
<p>بیش از ۸ سال همکاری با برندهای ایرانی در حوزه فن‌آوری و خدمات.</p>
</section>
<a href="mailto:nima@example.com" class="cta">تماس برای مشاوره</a>
<footer style="margin-top:4rem;color:var(--muted);font-size:0.9rem;">
تهران — ۱۴۰۵
</footer>
</div>
</body>
</html>
